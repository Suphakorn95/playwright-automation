name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to run tests on'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit
      test_file:
        description: 'Test file to run (leave empty to run all tests)'
        required: false
        default: ''
        type: string
      headed:
        description: 'Run in headed mode'
        required: false
        default: false
        type: boolean

jobs:
  test:
    name: Run Playwright Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        id: run_tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: results.json
        run: |
          ARGS="--reporter=html,github,json"

          # Browser selection
          if [ "${{ github.event.inputs.browser }}" != "all" ] && [ -n "${{ github.event.inputs.browser }}" ]; then
            ARGS="$ARGS --project=${{ github.event.inputs.browser }}"
          fi

          # Specific test file
          if [ -n "${{ github.event.inputs.test_file }}" ]; then
            ARGS="$ARGS ${{ github.event.inputs.test_file }}"
          fi

          # Headed mode (only works with xvfb on Linux)
          if [ "${{ github.event.inputs.headed }}" == "true" ]; then
            ARGS="$ARGS --headed"
            npx xvfb-maybe npx playwright test $ARGS
          else
            npx playwright test $ARGS
          fi

      - name: Display test results summary
        if: always()
        run: |
          if [ -f results.json ]; then
            echo "## Playwright Test Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            TOTAL=$(node -e "const r=require('./results.json'); console.log(r.stats.expected + r.stats.unexpected + r.stats.skipped)")
            PASSED=$(node -e "const r=require('./results.json'); console.log(r.stats.expected)")
            FAILED=$(node -e "const r=require('./results.json'); console.log(r.stats.unexpected)")
            SKIPPED=$(node -e "const r=require('./results.json'); console.log(r.stats.skipped)")
            DURATION=$(node -e "const r=require('./results.json'); console.log((r.stats.duration/1000).toFixed(1))")

            echo "| Result | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏭️ Skipped | $SKIPPED |" >> $GITHUB_STEP_SUMMARY
            echo "| 🔢 Total | $TOTAL |" >> $GITHUB_STEP_SUMMARY
            echo "| ⏱️ Duration | ${DURATION}s |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$FAILED" -gt "0" ]; then
              echo "### ❌ Failed Tests" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              node -e "
                const r = require('./results.json');
                r.suites.forEach(suite => {
                  suite.suites && suite.suites.forEach(s => {
                    s.specs && s.specs.forEach(spec => {
                      spec.tests && spec.tests.forEach(test => {
                        if (test.status !== 'expected') {
                          console.log('- \`' + spec.title + '\` — ' + suite.title);
                        }
                      });
                    });
                  });
                });
              " >> $GITHUB_STEP_SUMMARY
            fi
          fi

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
